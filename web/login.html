<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#102721"><title>เข้าสู่ระบบ · หมูเฮง LIVE Games</title><link rel="stylesheet" href="/auth.css"></head><body data-page="login"><main class="auth-shell"><a class="brand" href="/login">✦ หมูเฮง <span>LIVE GAMES</span></a><section class="auth-card"><p class="eyebrow">WELCOME TO YOUR LIVE WORLD</p><h1 id="auth-title">เข้าสู่ระบบ</h1><p class="intro">เลือกเกม จัดของขวัญ และสร้างหน้าจอสำหรับไลฟ์ของคุณ</p><form id="auth-form"><label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required><label for="password">รหัสผ่าน</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128"><button id="auth-submit" type="submit">เข้าสู่ระบบ</button></form><p id="auth-message" role="status" aria-live="polite"></p><button id="reset-password" type="button" class="text-button">ลืมรหัสผ่าน?</button><div class="divider"></div><button id="toggle-registration" type="button" class="secondary">ยังไม่มีบัญชี? สมัครสมาชิก</button></section><p class="note">เข้าสู่ระบบก่อนใช้งาน · ลิงก์จอไลฟ์สร้างได้จากบัญชีของคุณ</p></main><script type="module" src="/auth.js"></script></body></html>
